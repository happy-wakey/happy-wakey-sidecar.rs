[package]
name = "happy-wakey-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Fail-closed Happy Wakey Kubernetes sidecar"
repository = "https://github.com/happy-wakey/happy-wakey-sidecar.rs"
readme = "README.md"

[lib]
name = "happy_wakey_sidecar"
path = "src/lib.rs"

[[bin]]
name = "happy-wakey-sidecar"
path = "src/main.rs"

[dependencies]
ores-otel-sidecar = { git = "https://github.com/ores-otel/ores-otel-sidecar.rs", rev = "24470e6324c055103c16b0ba36c366415eebad42" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
